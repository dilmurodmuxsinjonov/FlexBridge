name: flexbridge-r1

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flexbridge}
      POSTGRES_USER: ${POSTGRES_USER:-flexbridge_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - "postgres"
      - "-c"
      - "max_connections=80"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../FlexBridge_1_4_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flexbridge_owner} -d $${POSTGRES_DB:-flexbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-flexbridge}
      DB_USER: ${POSTGRES_USER:-flexbridge_owner}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 400

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flexbridge_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flexbridge_owner}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-flexbridge}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "8000:8000"

  outbox-worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox"]
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      clamav:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flexbridge_owner}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-flexbridge}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:
