name: flexbridge-r1

x-app: &app
  build:
    context: ..
    dockerfile: backend/Dockerfile
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flexbridge_owner}:${POSTGRES_PASSWORD:?required}@pgbouncer:5432/${POSTGRES_DB:-flexbridge}
    S3_ENDPOINT_URL: http://minio:9000
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-flexbridge_minio}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
    S3_BUCKET: flexbridge-private
    CLAMAV_HOST: clamav
    CLAMAV_PORT: 3310
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?required}
    MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?required}
    AUTH_HMAC_KEY: ${AUTH_HMAC_KEY:?required}
    AUTH_DELIVERY_URL: ${AUTH_DELIVERY_URL:-}
    AUTH_DELIVERY_TOKEN: ${AUTH_DELIVERY_TOKEN:-}
    TERMS_POLICY_VERSION: ${TERMS_POLICY_VERSION:-}
    PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-}
    WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
    WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
    PAYMENT_GATEWAY_URL: ${PAYMENT_GATEWAY_URL:-}
    PAYMENT_GATEWAY_TOKEN: ${PAYMENT_GATEWAY_TOKEN:-}
    FLEXBRIDGE_ENV: production

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flexbridge}
      POSTGRES_USER: ${POSTGRES_USER:-flexbridge_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flexbridge_owner}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-flexbridge}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p0
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-flexbridge}
      DB_USER: ${POSTGRES_USER:-flexbridge_owner}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 400

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flexbridge_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    command: server /data
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["miniodata:/data"]

  storage-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flexbridge_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break
          sleep 2
        done
        mc mb --ignore-existing local/flexbridge-private
        mc anonymous set private local/flexbridge-private
        mc version enable local/flexbridge-private

  clamav:
    image: clamav/clamav:1.4
    volumes: ["clamavdata:/var/lib/clamav"]

  backend:
    <<: *app
    restart: unless-stopped
    depends_on:
      pgbouncer: {condition: service_started}
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      clamav: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready',timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5

  outbox-worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox"]
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      pgbouncer: {condition: service_started}
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      clamav: {condition: service_started}

  identity-worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox"]
    environment:
      <<: *app-env
      OUTBOX_EVENT_TYPES: AUTH_OTP_DELIVERY
      OUTBOX_WORKER_KEY: identity
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      pgbouncer: {condition: service_started}
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  miniodata:
  clamavdata:
