name: Windows agent coordinator boundaries
on: [push, pull_request]
jobs:
  protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check exclusive lock, structured outcomes and handback
        run: python scripts/agents/check_master_protocol.py
