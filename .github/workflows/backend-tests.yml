name: PostgreSQL backend regressions
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_runner -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FLEXBRIDGE_TEST_ADMIN_URL: postgresql+psycopg://test_runner:ephemeral_ci_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check_publish.py
      - run: python -m pytest backend -q --junitxml=backend/.data/junit.xml
